name: ci

on:
  push:
  pull_request:

# Least-privilege defaults for all jobs (CodeQL: actions/missing-workflow-permissions).
permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.timeout }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.10"
            timeout: 90

          - os: ubuntu-latest
            python: "3.12"
            timeout: 90

          - os: ubuntu-latest
            python: "3.14"
            timeout: 90

          - os: windows-latest
            python: "3.12"
            timeout: 90

          - os: macos-latest
            python: "3.12"
            timeout: 90

    env:
      PYTHONPATH: src
      NO_COLOR: "1"
      CLICOLOR: "0"
      TERM: dumb

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" build twine

      - name: Test
        run: python -m pytest -q

      - name: Deterministic Fleet smoke suite
        run: python -m pytest -q tests/fleet

      - name: Compile
        run: python -m compileall -q src

      - name: Build distributions
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        run: python -m build --sdist --wheel --outdir dist

      - name: Check distributions
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        run: python -m twine check dist/*